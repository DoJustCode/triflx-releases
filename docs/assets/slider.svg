<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-label="Схема: шторка «до и после»">
<style>
:root{--bg:#f6f7fd;--tx:#14163a;--mut:#5b5f8a}
@media (prefers-color-scheme:dark){:root{--bg:#14162e;--tx:#f2f3ff;--mut:#a3a8d8}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;fill:var(--tx)}
.m{fill:var(--mut);font-size:14px}
.clip{animation:sl 5s ease-in-out infinite}.h{animation:sl 5s ease-in-out infinite}
@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(-165px)}}
</style>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2f6b"/><stop offset=".5" stop-color="#f0756d"/><stop offset="1" stop-color="#f5c27a"/></linearGradient>
<clipPath id="c"><rect x="16" y="16" width="388" height="190" rx="12"/></clipPath>
<clipPath id="right"><rect class="clip" x="210" y="16" width="194" height="190"/></clipPath><g id="scene"><rect width="388" height="190" fill="url(#sky)"/><circle cx="280" cy="110" r="28" fill="#fbeccd"/><path d="M0 190V135Q70 100 130 135T260 130T388 120V190Z" fill="#46407f"/><path d="M0 190V160Q90 130 170 160T330 155T388 150V190Z" fill="#1f2350"/></g></defs>
<rect width="420" height="300" rx="20" fill="var(--bg)" data-deco="1"/>
<g clip-path="url(#c)" data-deco="1"><use href="#scene" x="16" y="16"/><g clip-path="url(#right)"><use href="#scene" x="16" y="16" opacity=".8"/></g></g>
<g class="h" data-deco="1"><line x1="210" y1="16" x2="210" y2="206" stroke="#fff" stroke-width="3"/><circle cx="210" cy="111" r="17" fill="#fff"/><path d="M203 111 L208 106 V116Z M217 111 L212 106 V116Z" fill="#14163a"/></g>
<text x="16" y="238">Слева: оригинал, 2,2 МБ</text>
<text x="16" y="262">Справа: WebP, 125 КБ (−94%)</text>
<text x="16" y="286" class="m">Схема. Настоящее окно — ниже.</text>
</svg>
