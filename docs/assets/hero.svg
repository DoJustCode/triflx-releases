<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="triflX — сжимает картинки, видео, GIF, PDF и аудио автоматически">
<style>
:root{--bg1:#f4f6ff;--bg2:#e9e6ff;--tx:#14163a;--mut:#5b5f8a;--bar:#c9cdf5;--acc:#4f6bff;--ok:#18a058}
@media (prefers-color-scheme:dark){:root{--bg1:#14162e;--bg2:#1d1a42;--tx:#f2f3ff;--mut:#a3a8d8;--bar:#3a3f78;--acc:#7b8dff;--ok:#4cd68b}}
.t{font:700 64px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--tx)}
.s{font:500 24px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--mut)}
.l{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--tx)}
.m{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--mut)}
.big{fill:var(--bar)}
.small{fill:var(--acc);transform-box:fill-box;transform-origin:left center;animation:sh 4s ease-in-out infinite}
@keyframes sh{0%,12%{transform:scaleX(1)}45%,85%{transform:scaleX(.27)}100%{transform:scaleX(1)}}
.pct{fill:var(--ok);font:700 20px -apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;animation:pc 4s ease-in-out infinite}
@keyframes pc{0%,30%{opacity:0}50%,85%{opacity:1}100%{opacity:0}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--bg1)"/><stop offset="1" stop-color="var(--bg2)"/></linearGradient>
<linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8bff"/><stop offset="1" stop-color="#6a3df0"/></linearGradient></defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect x="64" y="64" width="112" height="112" rx="26" fill="url(#ic)"/>
<g stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M98 98 L116 116 M98 116 L98 98 L116 98"/><path d="M142 142 L124 124 M142 124 L142 142 L124 142"/></g>
<text x="200" y="136" class="t">triflX</text>
<text x="66" y="236" class="s">Сжимает картинки, видео, GIF, PDF и аудио сам.</text>
<text x="66" y="272" class="s">В строке меню. Всё на вашем Mac, без интернета.</text>
<text x="66" y="352" class="m">macOS 13+ · Apple Silicon и Intel · бесплатно · без телеметрии</text>
<g transform="translate(640,90)">
<text x="0" y="0" class="l">photo.jpg</text><text x="520" y="0" class="m" text-anchor="end">до → после (пример)</text>
<rect x="0" y="16" width="520" height="30" rx="8" class="big"/><rect x="0" y="16" width="520" height="30" rx="8" class="small"/><text x="528" y="38" class="pct">−73%</text>
<text x="0" y="96" class="l">clip.mp4</text>
<rect x="0" y="112" width="520" height="30" rx="8" class="big"/><rect x="0" y="112" width="520" height="30" rx="8" class="small" style="animation-delay:.25s"/>
<text x="0" y="192" class="l">scan.pdf</text>
<rect x="0" y="208" width="520" height="30" rx="8" class="big"/><rect x="0" y="208" width="520" height="30" rx="8" class="small" style="animation-delay:.5s"/>
<text x="0" y="288" class="m">Иллюстрация: размеры условные</text>
</g>
</svg>
