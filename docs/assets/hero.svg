<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="420" height="460" role="img" aria-label="triflX — сжимает картинки, видео, GIF, PDF и аудио автоматически">
<style>
:root{--bg1:#f4f6ff;--bg2:#e9e6ff;--tx:#14163a;--mut:#5b5f8a;--bar:#c9cdf5;--acc:#4f6bff;--ok:#18a058}
@media (prefers-color-scheme:dark){:root{--bg1:#14162e;--bg2:#1d1a42;--tx:#f2f3ff;--mut:#a3a8d8;--bar:#3a3f78;--acc:#7b8dff;--ok:#4cd68b}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:48px;font-weight:700;fill:var(--tx)}.s{font-size:17px;font-weight:500;fill:var(--tx)}.l{font-size:16px;font-weight:600;fill:var(--tx)}.m{font-size:14px;fill:var(--mut)}
.small{fill:var(--acc);transform-box:fill-box;transform-origin:left center;animation:sh 4s ease-in-out infinite}
@keyframes sh{0%,12%{transform:scaleX(1)}45%,85%{transform:scaleX(.27)}100%{transform:scaleX(1)}}
.pct{fill:var(--ok);font-size:17px;font-weight:700;animation:pc 4s ease-in-out infinite}
@keyframes pc{0%,30%{opacity:0}50%,85%{opacity:1}100%{opacity:0}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--bg1)"/><stop offset="1" stop-color="var(--bg2)"/></linearGradient>
<linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8bff"/><stop offset="1" stop-color="#6a3df0"/></linearGradient></defs>
<rect width="420" height="460" rx="24" fill="url(#bg)" data-deco="1"/>
<rect x="24" y="24" width="72" height="72" rx="17" fill="url(#ic)" data-deco="1"/>
<g stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" data-deco="1"><path d="M46 46 L58 58 M46 58 L46 46 L58 46"/><path d="M74 74 L62 62 M74 62 L74 74 L62 74"/></g>
<text x="112" y="74" class="t">triflX</text>
<text x="24" y="134" class="s">Сжимает картинки, видео, GIF,</text>
<text x="24" y="160" class="s">PDF и аудио — сам, в фоне.</text>
<text x="24" y="186" class="s">Всё на вашем Mac, офлайн.</text>
<text x="24" y="238" class="l">photo.jpg</text><text x="396" y="238" class="pct" text-anchor="end">−73%</text>
<rect x="24" y="248" width="372" height="22" rx="8" fill="var(--bar)" data-deco="1"/><rect x="24" y="248" width="372" height="22" rx="8" class="small" data-deco="1"/>
<text x="24" y="302" class="l">clip.mp4</text>
<rect x="24" y="312" width="372" height="22" rx="8" fill="var(--bar)" data-deco="1"/><rect x="24" y="312" width="372" height="22" rx="8" class="small" style="animation-delay:.25s" data-deco="1"/>
<text x="24" y="366" class="l">scan.pdf</text>
<rect x="24" y="376" width="372" height="22" rx="8" fill="var(--bar)" data-deco="1"/><rect x="24" y="376" width="372" height="22" rx="8" class="small" style="animation-delay:.5s" data-deco="1"/>
<text x="24" y="426" class="m">macOS 13+ · Apple Silicon и Intel</text>
<text x="24" y="446" class="m">Бесплатно · размеры условные</text>
</svg>
