<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" width="420" height="520" role="img" aria-label="Схема: контекстное меню Finder с пунктом triflX">
<style>
:root{--bg:#f6f7fd;--menu:#fdfdff;--bd:#cfd3ee;--tx:#14163a;--mut:#5b5f8a;--sel:#4f6bff}
@media (prefers-color-scheme:dark){:root{--bg:#14162e;--menu:#25274f;--bd:#3d4287;--tx:#f2f3ff;--mut:#a3a8d8;--sel:#5b6cff}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;fill:var(--tx)}
.m{fill:var(--mut);font-size:14px}.w{fill:#fff;font-weight:600}
</style>
<rect width="420" height="520" rx="20" fill="var(--bg)" data-deco="1"/>
<rect x="16" y="16" width="388" height="212" rx="12" fill="var(--menu)" stroke="var(--bd)"/>
<text x="36" y="50">Открыть</text><text x="36" y="84">Быстрый просмотр</text><line x1="28" y1="100" x2="392" y2="100" stroke="var(--bd)" data-deco="1"/>
<rect x="26" y="112" width="368" height="40" rx="8" fill="var(--sel)" data-deco="1"/><text x="40" y="138" class="w">Оптимизировать с triflX</text>
<rect x="26" y="160" width="368" height="40" rx="8" fill="var(--sel)" opacity=".18" data-deco="1"/><text x="40" y="186">Подменю triflX</text><text x="380" y="186" text-anchor="end">›</text>
<path d="M210 228 V248" stroke="var(--sel)" stroke-width="2" data-deco="1"/>
<rect x="44" y="248" width="360" height="232" rx="12" fill="var(--menu)" stroke="var(--bd)"/>
<text x="64" y="282">Попробовать варианты…</text><text x="64" y="316">Распознать текст (OCR)</text><text x="64" y="350">Удалить фон</text><text x="64" y="384">Размер под шаблон ›</text><text x="64" y="418">Документы ›</text>
<text x="64" y="448" class="m">PDF ↔ картинки, склейка, разбивка</text><text x="64" y="468" class="m">HEIC/RAW → JPEG</text>
<text x="16" y="506" class="m">Схема меню Finder, не скриншот.</text>
</svg>
