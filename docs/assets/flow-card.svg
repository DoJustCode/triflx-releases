<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 330" width="420" height="330" role="img" aria-label="Схема: скриншот, карточка с кнопкой «Отмена», готовый результат">
<style>
:root{--bg:#f6f7fd;--card:#fff;--bd:#d9dcf0;--tx:#14163a;--mut:#5b5f8a;--acc:#4f6bff;--ok:#18a058;--warn:#d93b41;--bar:#e6e8f8}
@media (prefers-color-scheme:dark){:root{--bg:#14162e;--card:#1f2145;--bd:#34387a;--tx:#f2f3ff;--mut:#a3a8d8;--acc:#7b8dff;--ok:#4cd68b;--warn:#c9363c;--bar:#2c3066}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:19px;font-weight:600;fill:var(--tx)}.m{font-size:15px;fill:var(--mut)}.l{font-size:15px;font-weight:600;fill:var(--acc)}.b{font-size:16px;font-weight:600;fill:#fff}
.step{opacity:0;animation:cy 9s infinite}
.s2{animation-delay:3s}.s3{animation-delay:6s}
@keyframes cy{0%{opacity:0}6%,30%{opacity:1}36%,100%{opacity:0}}
.fill{transform-box:fill-box;transform-origin:left center;animation:pg 3s linear infinite;animation-delay:3s}
@keyframes pg{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.d{fill:var(--bd);opacity:.9}.da{fill:var(--acc);opacity:0;animation:cy 9s infinite}
</style>
<rect width="420" height="330" rx="20" fill="var(--bg)" data-deco="1"/>
<rect x="16" y="16" width="388" height="250" rx="16" fill="var(--card)" stroke="var(--bd)"/>
<g class="step">
<text x="40" y="48" class="l">1 · Появился скриншот</text>
<rect x="40" y="64" width="340" height="110" rx="10" fill="var(--bar)" data-deco="1"/><circle cx="324" cy="96" r="14" fill="var(--acc)" opacity=".6"/><path d="M40 174 L130 108 L200 156 L250 124 L380 174Z" fill="var(--acc)" opacity=".35"/>
<text x="40" y="206" class="t">Снимок экрана.png</text><text x="40" y="232" class="m">4,2 МБ · в буфере обмена</text></g>
<g class="step s2">
<text x="40" y="48" class="l">2 · Пауза и карточка</text>
<text x="40" y="90" class="t">Сжимаю…</text><text x="40" y="114" class="m">Снимок экрана.png</text>
<rect x="40" y="134" width="340" height="10" rx="5" fill="var(--bar)" data-deco="1"/><rect x="40" y="134" width="340" height="10" rx="5" fill="var(--acc)" class="fill" data-deco="1"/>
<rect x="40" y="166" width="130" height="42" rx="10" fill="var(--warn)"/><text x="105" y="193" class="b" text-anchor="middle">Отмена</text>
<text x="40" y="240" class="m">оригинал не изменится</text></g>
<g class="step s3">
<text x="40" y="48" class="l">3 · Готово</text>
<text x="40" y="80" class="m">4,2 МБ → 0,6 МБ</text>
<text x="40" y="130" fill="var(--ok)" style="font-size:46px;font-weight:700">−86%</text>
<rect x="40" y="152" width="130" height="42" rx="10" fill="var(--acc)"/><text x="105" y="179" class="b" text-anchor="middle">Вернуть</text>
<rect x="182" y="152" width="130" height="42" rx="10" fill="none" stroke="var(--bd)"/><text x="247" y="179" class="m" text-anchor="middle">Сильнее</text>
<text x="40" y="236" class="m">возврат в один клик</text></g>
<circle cx="192" cy="290" r="5" class="d" data-deco="1"/><circle cx="210" cy="290" r="5" class="d" data-deco="1"/><circle cx="228" cy="290" r="5" class="d" data-deco="1"/>
<circle cx="192" cy="290" r="5" class="da" data-deco="1"/><circle cx="210" cy="290" r="5" class="da" style="animation-delay:3s" data-deco="1"/><circle cx="228" cy="290" r="5" class="da" style="animation-delay:6s" data-deco="1"/>
<text x="210" y="318" class="m" text-anchor="middle" style="font-size:14px">Схема, не скриншот. Цифры условные.</text>
</svg>
